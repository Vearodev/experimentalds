<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2a60" />
    <title>BASIS — дизайн-система</title>
    <script>
      try {
        document.documentElement.dataset.basisTheme =
          localStorage.getItem('basis.design-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.basisTheme = 'light';
      }
    </script>
    <meta
      name="description"
      content="Дизайн-система и демонстрационная облачная платформа BASIS."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
